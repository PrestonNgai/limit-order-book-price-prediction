[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-microstructure-research"
version = "0.10.1"
description = "Reproducible short-horizon limit-order-book research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=15,<18",
    "PyYAML>=6,<7",
    "pyarrow>=20,<24",
    "tzdata>=2025.1",
    "numpy>=2,<3",
    "scikit-learn>=1.7,<1.10",
    "threadpoolctl>=3.5,<4",
    "xgboost>=3.1,<3.5",
    "torch>=2.8,<2.15",
    "matplotlib>=3.10,<3.12",
]

[project.optional-dependencies]
compression = ["zstandard>=0.23,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "zstandard>=0.23,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
